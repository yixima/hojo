# 巡回対象の情報源
#
# ネットワーク設定：**Full（全ドメイン許可）** を採用（2026-08-19 決定）。
# 公募情報のドメイン空間は予測不能であることがDNS実測で判明したため
# （末尾の domain_survey を参照）、許可リスト方式は採らない。
#
# 巡回先は「ドメインを列挙できるか」とは別問題として、組織カテゴリで網羅する。
#
# 【2026-08-19 第2回巡回で判明・重要】
# 巡回時は必ずブラウザ相当の User-Agent を付けること。
#   curl -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 \
#            (KHTML, like Gecko) Chrome/128.0 Safari/537.36'
# www.chusho.meti.go.jp と www.meti.go.jp は CloudFront の UA フィルタにより、
# curl のデフォルト UA では 403 を返す。ブラウザ相当の UA なら 200。
# これはネットワークポリシーの問題ではない。第1回巡回で経産省系が読めなかった
# 原因はこれだった可能性が高い。

# =====================================================================
# 巡回先：組織カテゴリ別
# =====================================================================
# 全てを毎週巡回するのは非現実的なため、frequency で頻度を分ける。
#   every_run : 毎週必ず直接確認する
#   monthly   : 月1回（第1週）
#   seasonal  : 公告期（12〜6月）は毎週、端境期（7〜11月）は月1回
#   websearch : 直接巡回せず WebSearch で拾う（数が多すぎるもの）

# ---------------------------------------------------------------------
# A. 御社の事業と直結。最優先
# ---------------------------------------------------------------------
tier_a:
  frequency: every_run
  orgs:
    - name: 伝統的工芸品産業振興協会
      domain: kyokai.kougeihin.jp
      url: https://kyokai.kougeihin.jp/association_cat/公募公告/
      note: |
        最重要。「海外におけるテストマーケティング業務」「海外における実演・
        ワークショップ業務」など、御社の主力事業とほぼ完全に一致する企画提案募集を出す。

        【2026-08-20 訂正】公募公告カテゴリ121件を全数走査した結果、
        **「毎年4月上旬公告・5月中旬締切」は誤りだった。** 公告時期は年ごとに動く：
          令和6年度: 2024-06-26 公告 / 2024-07-12 締切
          令和7年度: 2025-06-23 公告 / 2025-08-11 締切
          令和8年度: 2026-04-01 公告 / 2026-05-15 締切
        → **監視期間は 3月中旬〜7月上旬。** 4月だけ見ていると2年分を取り逃す。
        6月下旬は2年連続で公告されており、むしろ本命に近い。

        英語・翻訳業務（企画競争）は5年連続で必ず出る（2022-07-04, 2023-06-09,
        2024-03-25, 2025-06-17, 2026-06-15 各締切）。規模は小さいが協会との
        取引実績を作る入口になる。

    - name: 公益財団法人東京都中小企業振興公社
      domain: tokyo-kosha.or.jp
      also: tokyoteshigoto.tokyo   # 「東京手仕事」事業サイト。地域TLD
      note: |
        御社の受託実績あり（令和4・5・7年度）。展示会出展助成事業も実施。
        【2026-08-19 確認】**tier_a で最も打率が高い発注元。**
        契約情報は https://www.tokyo-kosha.or.jp/kosha/keiyaku/index.html に一覧があり、
        件名・公表日・希望申出期間・受付状況が表で読める（ログイン不要）。
        応募は「ビジネスチャンス・ナビ」（https://www.chancenavi.jp/bcn/、登録無料）経由。
        **東京都の入札参加資格は不要。** 選定の制限は5項目のみ（法令上の許可、経営状態、
        営業経歴1年以上、指名停止、社会的信用）。
        令和8年度は海外関連業務を年間を通じて発注している（Tokyo SMEサポートデスク インド、
        海外ビジネス・チャレンジ塾、ベトナム現地商談会、タイ／ベトナム現地幹部人材育成講座、
        Food Japan 2026、海外企業とのイノベーション創出支援事業（マレーシア）等）。
        端境期でも案件が出るため、7〜11月も毎週確認する価値がある。

        【2026-08-20 追加】過年度契約情報（令和5〜7年度）から、
        **毎年必ず出る案件**が判明した。これが最良の予測材料になる：
          - 「東京手仕事」MAISON & OBJET 出展及びポップアップストア運営（3年連続・**最重要**）
            令和7年度分は 2025-03-18 入札 → 次回は 2027年2〜3月と予測
          - 東京都伝統工芸品展 運営管理業務（第68回→令和7年度→第70回）8月中旬公告
          - TOKYO職人展 運営管理業務（3年連続）5月中旬公告
          - 海外テストマーケティング・商談会 企画運営等委託（令和5・6・7年度）
          - 東京インターナショナル・ギフト・ショー 公社パビリオン運営（春2025・春2026）
          - 海外展示会出展ブース装飾等委託（Ambiente / ATX WEST / D&M WEST /
            NIPPON HAKU BANGKOK / POWERGEN / Food Japan 等、通年で随時）
        過年度一覧: https://www.tokyo-kosha.or.jp/kosha/keiyaku/end/index.html

        **ビジネスチャンス・ナビはログイン不要で検索・詳細閲覧ができる**（2026-08-20 確認）。
        `workflow/fetch_chancenavi.py` で取得できる。ログインが要るのは
        添付資料（仕様書・予定価格）の閲覧と、希望申請・入札などの送信操作のみ。
        公社案件の「契約方法」（希望制指名競争入札／総合評価方式入札など）は
        公社サイトの一覧には出ず、ナビの詳細ページにしかない。**必ずナビ側も見ること。**

    - name: 自治体国際化協会（CLAIR / クレア）
      domain: clair.or.jp
      note: |
        パリ・ロンドン・ニューヨーク・シンガポール・ソウル・北京・シドニーに
        海外事務所を持ち、自治体の国際化・海外プロモーションを支援する総務省系団体。
        海外事務所単位で現地イベント・展示会出展の委託を出すことがあり、
        御社の「自治体の海外展開支援」と最も近い発注元の一つ。**新規開拓の本命。**
        【2026-08-19 確認】**調達・入札の専用ページは存在しない。** 公募は
        トップページの新着情報に混ざって出る（JETプログラム関連は jetprogramme.org 側）。
        巡回は https://www.clair.or.jp/ と https://www.clair.or.jp/index-news.html を見る。
        助成事業（多文化共生／国際交流支援／自治体国際協力促進／経済活動助成）は
        すべて地方自治体等が対象で、御社は直接応募できない。ただし自治体が受給し
        御社が執行を受託する構図は成立する。
        営業導線として次の2つが有効：
          - プロモーションアドバイザー制度（海外プロモーション専門家を自治体に紹介）
            交流支援部経済交流課 keishin@clair.or.jp / 03-5213-1726
          - 海外活動支援（自治体の海外での販路拡大・観光PRを海外事務所が支援）
            総務部企画調査課 kikaku@clair.or.jp / 03-5213-1722

    - name: 独立行政法人日本貿易振興機構（JETRO）
      domain: jetro.go.jp
      url: https://www.jetro.go.jp/procurement/
      note: |
        海外展示会ジャパンパビリオンの運営受託。
        **入札情報と公募情報がページ分離されているため、毎回両方を見ること。**
          入札情報: https://www.jetro.go.jp/procurement/bid.html
          公募情報: https://www.jetro.go.jp/procurement/publicoffer.html
        海外展開支援部 国際博覧会課（Tel 03-3582-4688 / ODE@jetro.go.jp）は
        国際博覧会の日本館業務を「総合プロデュース」「行催事」「運営」「設計・監理」に
        分割発注する。2026-08-19時点でベオグラード博の行催事（限度額3.27億円）と
        運営が公告中。**公募形式は全省庁統一資格が不要な場合がある**（行催事業務が実例）。
        入札形式でも「JETRO発行の等級確認結果通知書」で統一資格を代替できる制度がある。

        【2026-08-20 追加】ジャパンパビリオンの「設計・監理等」は展示会ごとに
        **開催の約1年前に入札公告される**。実測（設計監理カテゴリ）：
          2025-07-14 Gulfood 2026 / 2025-07-17 BIOFACH 2026
          2025-08-01 Seafood Expo North America 2026 / 2025-08-21 FHA 2026
          2025-09-08 Seafood Expo Global 2026 / 2025-10-21 Summer Fancy Food Show 2026
          2025-10-22 National Restaurant Association Show 2026 / 2025-11-19 THAIFEX 2026
          2026-03-23 SIAL Paris 2026
          2026-06-26 Sirha 2027 / 2026-07-13 BIOFACH 2027 / 2026-07-27 SENA 2027
        → **7〜11月がジャパンパビリオン設計・監理の公告シーズン。** 下記の
        季節調整で「端境期」としていた時期が、JETROに関してはむしろ本番。
        いずれも食品系展示会のため御社の主戦場ではないが、ブース設計施工の
        実績づくりとJETROとの取引開始の入口になる。

    - name: 独立行政法人中小企業基盤整備機構（中小機構）
      domain: smrj.go.jp
      note: JAPANブランド育成支援等事業、TAKUMI NEXT。受託と営業機会の両面。

    - name: 中小企業庁
      domain: chusho.meti.go.jp
      note: |
        小規模事業者持続化補助金＜共同・協業型＞など。支援機関側で申請できる制度がある。
        【2026-08-19 確認】巡回先は3ページに分かれている。
          補助金: https://www.chusho.meti.go.jp/koukai/hojyokin/kobo.html
          委託事業: https://www.chusho.meti.go.jp/koukai/itaku/index.html
          入札・その他: https://www.chusho.meti.go.jp/koukai/nyusatsu/index.html
        **ブラウザ相当の User-Agent が必須**（冒頭の注記を参照）。
        ＜共同・協業型＞以外の補助金（新事業進出、省力化投資、持続化の一般型・創業型・
        災害支援枠、ものづくり等）は中小企業者・小規模事業者本人が対象で、
        一般社団法人は申請できない。
        ＜共同・協業型＞は一般社団法人が「地域振興等機関」として申請できる。
        詳細は reports/kobo_report_20260819b.md の論点①〜③を参照。

    - name: 独立行政法人国際交流基金（JF）
      domain: jpf.go.jp
      note: 文化芸術の海外発信。助成と受託の両方。海外拠点多数。

