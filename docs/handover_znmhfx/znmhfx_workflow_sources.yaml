# =====================================================================
# ドメイン実測調査（2026-08-19、DNS解決による全数検証）
# =====================================================================
domain_survey:
  method: getent hosts による名前解決。HTTPは遮断されているためDNSで存在を確認した。

  prefectures:
    summary: |
      47都道府県のうち、pref.X.lg.jp を持たない県が14ある。
      「*.lg.jp」だけを許可すると、この14県を丸ごと取りこぼす。
      御社の実績先である熊本県・岩手県・山形県・京都府がいずれも該当する。
    only_pref_x_jp:      # lg.jp が存在しない14県 ← *.lg.jp では拾えない
      [岩手, 宮城, 山形, 茨城, 群馬, 山梨, 静岡, 愛知, 京都, 岡山, 愛媛, 熊本, 大分, 鹿児島]
    only_pref_x_lg_jp:   # 19道府県
      [北海道, 青森, 千葉, 新潟, 福井, 長野, 岐阜, 三重, 滋賀, 大阪, 和歌山, 島根, 山口, 徳島, 香川, 高知, 福岡, 佐賀, 宮崎]
    both:                # 12県
      [秋田, 福島, 栃木, 埼玉, 神奈川, 富山, 石川, 奈良, 鳥取, 広島, 長崎, 沖縄]
    irregular:
      東京都: www.metro.tokyo.lg.jp    # pref ではなく metro
      兵庫県: web.pref.hyogo.lg.jp     # www ではなく web

  municipalities:
    summary: |
      政令指定都市20市を検証したところ、3パターンが混在し規則性がない。
      1,700超の市区町村を列挙するのは不可能。
    pattern_city_x_lg_jp: [さいたま, 千葉, 横浜, 新潟, 静岡, 京都, 大阪, 堺, 神戸, 広島, 北九州, 福岡]
    pattern_city_x_jp:    [札幌, 仙台, 川崎, 名古屋, 岡山, 熊本]
    pattern_city_x_pref_jp:
      相模原: www.city.sagamihara.kanagawa.jp   # lg.jp も city.X.jp も無い
      浜松:   www.city.hamamatsu.shizuoka.jp    # 同上
    tokyo_wards: |
      23区も混在。千代田区・江東区は両方、港区・渋谷区・足立区・大田区・練馬区は
      city.X.tokyo.jp のみ、中央区・新宿区・世田谷区は city.X.lg.jp のみ。

  non_jp_tlds:
    summary: 公的な公募情報が .jp 以外に置かれている実例。ここが最大の盲点だった。
    verified:
      - { domain: tokyoteshigoto.tokyo, note: "「東京手仕事」公式サイト。御社の主力受注先の事業ブランド" }
      - { domain: kougei.tokyo,         note: 東京の工芸関連 }
      - { domain: gotokyo.org,          note: 東京観光公式 }
      - { domain: kyoto.travel,         note: 京都市観光協会 }
      - { domain: association.sapporo.travel, note: 札幌観光協会。北米市場向けプロモーション業務の公募実績あり }
      - { domain: yokohamajapan.com,    note: 横浜観光 }
      - { domain: r6.kyodokyogyohojokin.info, note: 小規模事業者持続化補助金＜共同・協業型＞事務局 }
      - { domain: jizokukahojokin.info, note: 小規模事業者持続化補助金 事務局 }
      - { domain: njss.info,            note: NJSS。民間の入札情報集約サービス }
      - { domain: wabisabistore.net,    note: 御社の越境EC }
    caution: |
      補助金事務局のドメインは年度ごとに変わる（r6→r7 など）。
      また新制度ができるたびに新ドメインが立つため、事前列挙は不可能。
      *.info をまとめて許可しておくのが現実的。

  blocked_domains:
    summary: |
      2026-08-19 の巡回で egress ポリシーにより CONNECT が拒否された（502）ドメイン。
      許可リストへの追加を検討する。プロキシの recentRelayFailures で確認できる：
        curl -sS "$HTTPS_PROXY/__agentproxy/status"
    verified:
      - { domain: www.kougei.or.jp, note: "日本工芸会系。伝産協会は kyokai.kougeihin.jp で到達可のため実害は小" }
      - { domain: www.mirasapo-plus.go.jp, note: "中小企業支援制度の横断検索。月次巡回で必要。追加推奨" }
      - { domain: s-hojokin.jp, note: "省力化投資補助金事務局。優先度低" }
    not_blocked_but_403:
      - { domain: www.chusho.meti.go.jp, note: "UAフィルタ。ブラウザ相当UAで200" }
      - { domain: www.meti.go.jp, note: "同上" }

  # =====================================================================
  # 落札金額はどこで取れるか（2026-08-20 実測）
  # =====================================================================
  award_amounts:
    summary: |
      予定価格が非公開の案件でも、**過年度の落札金額から規模を推定できる**。
      ただし公表しているのは国の機関だけで、東京都の外郭団体は公表していない。
    published:
      - org: JETRO
        url: https://www.jetro.go.jp/procurement/contract.html
        note: |
          月次PDF。国内契約（競争入札／随意契約・競争性のあるもの／その他）と
          海外契約（四半期）に分かれる。契約先・契約金額・落札率まで載る。
          実測（2026-08-20）:
            ベオグラード博 日本館 総合プロデュース・展示設計監理・広報
              = 323,807,861円（大日本印刷、2026-02-19、企画競争、落札率100%）
            ジャパンパビリオン 設計・監理等
              = BIOFACH 2026 1,669,420円 ／ THAIFEX 2026 1,803,080円（株式会社アライズ）
              → **500万円の足切り基準を下回る。設計・監理は狙う対象ではない**
            海外ジャパンパビリオン 施工業務 = 21,317,269〜36,855,323円
            ジャパン・パビリオン 出展運営   = 3,419,092〜22,114,248円
              → **狙うべきはこちら**
      - org: 独立行政法人国際交流基金（JF）
        url: https://www.jpf.go.jp/j/about/bid/result/
        note: |
          案件ごとのページに 落札者・落札金額・予定価格・落札率 が全て載る。
          最も情報量が多い。予定価格が分かるので落札率の相場も読める。
      - org: 経済産業省
        url: https://www.meti.go.jp/information_2/publicoffer/R_00_bid_news_list.html
        note: |
          年度ごとのExcel（物品役務等／委託契約 × 競争入札／随意契約）。
          列に「予定価格（円）」「契約金額（円）」「落札率（％）」がある。
          例: itaku_bid_r8.xlsx / itaku_zuikei_r8.xlsx
          ただし予定価格は「非公表」の行も多い。
    not_published:
      - org: 公益財団法人東京都中小企業振興公社
        note: |
          **落札金額を公表していない。** 2026-08-20 に次を全て確認したが金額欄が無い：
            契約情報ページ / 過年度契約情報（令和5〜7年度）/ 事業報告（令和6年度・全230頁）
          事業報告には会期・会場・出展品数などの規模は載るが金額は無い。
          （第68回東京都伝統工芸品展＝令和7年1月15〜20日・新宿髙島屋11階・40工芸品、
            TOKYO職人展＝令和6年9月27日〜10月10日・伝統工芸青山スクエア・10工芸品13名）
          ビジネスチャンス・ナビは「案件公表から落札者決定まで一貫」処理するため、
          **ログインすれば落札結果を確認できる可能性が高い。次回ログイン時に要確認。**
      - org: 伝統的工芸品産業振興協会
        note: 結果公示のカテゴリが見当たらない。落札金額は未確認

  qualification_sites:
    summary: 全省庁統一資格（申請中）に直結するサイト
    verified:
      - { domain: www.geps.go.jp, note: 政府電子調達システム。統一資格の電子申請はここ }
      - { domain: www.p-portal.go.jp, note: 調達ポータル }
      - { domain: www.jgrants-portal.go.jp, note: jGrants }
    not_resolved:
      - { domain: www.chotatujouhou.go.jp, note: "統一資格審査申請・調達情報検索サイト。名前解決せず。URLが変わった可能性あり、要再調査" }
