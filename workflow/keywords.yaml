# 検索キーワード辞書
#
# profile/company-profile.yaml の domains: を検索語に展開したもの。
# WebSearch のクエリ組み立てと、取得したページのスクリーニングの両方で使う。

# --- 案件種別を示す語（必ずどれか1つ以上を含む）---
procurement_terms:
  - 公募
  - 企画競争
  - 企画提案
  - プロポーザル
  - 公募型プロポーザル
  - 補助金
  - 助成金
  - 委託業務
  - 業務委託
  - 参加者募集

# --- 事業内容の核。スコアリングの主軸 ---
core:
  overseas_expansion:      # 海外展開
    - 海外展開
    - 海外販路開拓
    - 販路開拓
    - 海外市場開拓
    - 輸出促進
    - 越境EC
    - テストマーケティング
    - バイヤー招へい
    - 商談会
  crafts:                  # 伝統工芸・地域産品
    - 伝統的工芸品
    - 伝統工芸
    - 工芸品
    - 地場産業
    - 地域産品
    - 県産品
    - 特産品
    - ものづくり
  exhibitions:             # 展示会・出展
    - 海外展示会
    - 国際見本市
    - 見本市
    - 出展
    - 出展支援
    - ジャパンパビリオン
    - パビリオン
    - ブース
    - 展示商談会
    - ポップアップ
  culture:                 # 文化・アート
    - 日本文化
    - 文化芸術
    - 対外発信
    - 海外発信
    - 国際発信
    - 国際交流
    - アートフェア
    - 現代アート
    - コンテンツ
    - クールジャパン
  inbound:                 # インバウンド
    - インバウンド
    - 訪日
    - 訪日誘客
    - 観光プロモーション
    - 誘客促進
  branding:                # 地域ブランディング
    - シティプロモーション
    - 地域ブランド
    - 魅力発信
    - 情報発信
    - ブランディング

# --- 海外地域名。御社が実績を持つ地域を優先的に拾う ---
regions:
  strong:                  # 実績が厚い。加点対象
    - フランス
    - パリ
    - 欧州
    - ヨーロッパ
    - スペイン
    - バルセロナ
    - イタリア
    - ローマ
    - 英国
    - ロンドン
    - ドバイ
    - UAE
    - 中東
    - 台湾
    - 米国
    - ニューヨーク
    - マイアミ
  neutral:
    - アジア
    - 東南アジア
    - 中国
    - 韓国
    - シンガポール

# --- 除外語。これらが主題の案件は御社の事業と無関係 ---
exclude:
  - 建設工事
  - 土木
  - 舗装
  - 設計監理
  - 清掃業務
  - 警備業務
  - 給食
  - 医療機器
  - 車両購入
  - 燃料
  - 保守点検
  - システム開発
  - システム保守
  - 人材派遣
  - 廃棄物
  - 上下水道
  - 用地買収

# 除外の注意:
#   「印刷」「カタログ制作」「Webサイト制作」は単体では御社の主力ではないが、
#   海外出展事業に付随する制作物として案件に含まれることが多い。
#   単独の印刷請負のみを除外し、core の語と併記されている場合は除外しないこと。

# --- WebSearch のクエリ雛形 ---
# core の各カテゴリ × procurement_terms を組み合わせて生成する。
# 年度が変わる語（令和8年度 / 2026年度）を必ず付けて、古い公募を拾わないようにする。
query_templates:
  - "{craft} {procurement} 海外 {year}"
  - "{overseas} {procurement} {year} 締切"
  - "{exhibition} 運営業務 {procurement} {year}"
  - "{culture} 海外 {procurement} {year}"
  - "{inbound} プロモーション {procurement} {year}"
  - "自治体 {overseas} {procurement} {year}"
