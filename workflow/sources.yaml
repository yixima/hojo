# =====================================================================
# ドメイン実測調査（2026-08-26、DNS解決による全数検証）
# =====================================================================
domain_survey:
  method: getent hosts による名前解決。HTTPは遮断されているためDNSで存在を確認した。

  prefectures:
    summary: |
      47都道府県のうち、pref.X.lg.jp を持たない県が14ある。
      「*.lg.jp」だけを許可すると、この14県を丸ごと取りこぼす。
      御社の実績先である熊本県・岩手県・山形県・京都府がいずれも該当する。
    only_pref_x_jp:      # lg.jp が存在しない14県 ← *.lg.jp では拾えない
      [岩手, 宮城, 山形, 茨城, 群馬, 山梨, 静岡, 愛知, 京都, 岡山, 愛媛, 熊本, 大分, 鹿児島]
    only_pref_x_lg_jp:   # 19道府県
      [北海道, 青森, 千葉, 新潟, 福井, 長野, 岐阜, 三重, 滋賀, 大阪, 和歌山, 島根, 山口, 徳島, 香川, 高知, 福岡, 佐賀, 宮崎]
    both:                # 12県
      [秋田, 福島, 栃木, 埼玉, 神奈川, 富山, 石川, 奈良, 鳥取, 広島, 長崎, 沖縄]
    irregular:
      東京都: www.metro.tokyo.lg.jp    # pref ではなく metro
      兵庫県: web.pref.hyogo.lg.jp     # www ではなく web

  municipalities:
    summary: |
      政令指定都市20市を検証したところ、3パターンが混在し規則性がない。
      1,700超の市区町村を列挙するのは不可能。
    pattern_city_x_lg_jp: [さいたま, 千葉, 横浜, 新潟, 静岡, 京都, 大阪, 堺, 神戸, 広島, 北九州, 福岡]
    pattern_city_x_jp:    [札幌, 仙台, 川崎, 名古屋, 岡山, 熊本]
    pattern_city_x_pref_jp:
      相模原: www.city.sagamihara.kanagawa.jp   # lg.jp も city.X.jp も無い
      浜松:   www.city.hamamatsu.shizuoka.jp    # 同上
    tokyo_wards: |
      23区も混在。千代田区・江東区は両方、港区・渋谷区・足立区・大田区・練馬区は
      city.X.tokyo.jp のみ、中央区・新宿区・世田谷区は city.X.lg.jp のみ。

  non_jp_tlds:
    summary: 公的な公募情報が .jp 以外に置かれている実例。ここが最大の盲点だった。
    verified:
      - { domain: tokyoteshigoto.tokyo, note: "「東京手仕事」公式サイト。御社の主力受注先の事業ブランド" }
      - { domain: kougei.tokyo,         note: 東京の工芸関連 }
      - { domain: gotokyo.org,          note: 東京観光公式 }
      - { domain: kyoto.travel,         note: 京都市観光協会 }
      - { domain: association.sapporo.travel, note: 札幌観光協会。北米市場向けプロモーション業務の公募実績あり }
      - { domain: yokohamajapan.com,    note: 横浜観光 }
      - { domain: r6.kyodokyogyohojokin.info, note: 小規模事業者持続化補助金＜共同・協業型＞事務局 }
      - { domain: jizokukahojokin.info, note: 小規模事業者持続化補助金 事務局 }
      - { domain: njss.info,            note: NJSS。民間の入札情報集約サービス }
      - { domain: wabisabistore.net,    note: 御社の越境EC }
    caution: |
      補助金事務局のドメインは年度ごとに変わる（r6→r7 など）。
      また新制度ができるたびに新ドメインが立つため、事前列挙は不可能。
      *.info をまとめて許可しておくのが現実的。


  full_inventory:
    surveyed: 2026-08-26
    summary: |
      巡回対象のドメインをDNSで全数実測し、以下を確定した。
      これにより「どこを見るべきか」のリストは実質的に完成した。
    counts:
      都道府県: 47/47（pref_hosts.json に格納）
      都道府県の産業振興外郭団体: 45/47（長野・鹿児島が未特定）
      政令指定都市: 20/20
      東京23区: 22/23（中野区が未特定）
      中核市ほか主要市: 48/49
      国の府省庁・独法・外郭団体: 30組織
      観光協会・DMO・文化財団: 9組織
      商工会議所・商工会・中央会: 8組織
    method: |
      getent hosts による名前解決。HTTPが遮断されていてもDNSは通るため、
      到達性と実在を分けて確認できる。未特定のものは候補ドメインが解決しなかった
      もので、次回巡回時にWebSearchで正式URLを特定する。

