# 公募カレンダー ― 「まだ出ていないが、必ず出る案件」の予測台帳
#
# 目的：締切に気づいてから動くのでは間に合わない。過去の公告実績から
#       「いつ・どこが・何を出すか」を先回りして把握し、公告前から準備に入る。
#
# 使い方（runbook 手順3.5）：
#   毎回の巡回時、watch_from が当日から30日以内に迫っている項目について
#   発注機関のサイトを直接確認し、公告が出ていれば台帳へ登録する。
#   公告が出たら observed に実績を追記し、翌年の予測精度を上げる。
#
# 凡例
#   confidence: high   = 複数年の公告実績を直接確認済み
#               medium = 1年分の実績を確認、または制度上ほぼ確実
#               low    = 状況証拠による推定。要検証
#   watch_from: この日から監視を開始する（公告予想日の2〜4週間前）

# ─────────────────────────────────────────────────────────────
# 最重点 ― 御社の主力事業と直結。取り逃すと1年待ち
# ─────────────────────────────────────────────────────────────
