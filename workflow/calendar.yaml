fiscal_cycle:
  - phase: 12月〜1月
    what: 翌年度予算の内示を受け、国の企画競争・補助金が公告開始
    action: 経産省・文化庁・観光庁・中小企業庁の公募ページを毎週確認
  - phase: 2月〜3月
    what: 補正予算に基づく公募が集中。翌年度案件の公告も本格化
    action: 伝統的工芸品産業振興協会（3月中旬〜）を最重点で監視
  - phase: 4月〜6月
    what: 年度当初案件のピーク。自治体のプロポーザルが最多
    action: 47都道府県＋政令市を毎週巡回。取り逃しが最も痛い時期
  - phase: 7月〜8月
    what: 年度前半の補完的な公募。文化庁の国際事業がこの時期
    action: 通常巡回
  - phase: 9月〜11月
    what: 端境期。補正予算関連の補助金が散発
    action: 通常巡回。カレンダーの精度向上と、翌年度に向けた準備に充てる

