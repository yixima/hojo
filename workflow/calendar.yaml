# ─────────────────────────────────────────────────────────────
# 東京都中小企業振興公社 ― 過年度契約情報アーカイブから復元した年間サイクル
# ─────────────────────────────────────────────────────────────
# 出典: https://www.tokyo-kosha.or.jp/kosha/keiyaku/end/ （令和2〜7年度）
# 【最重要の構造】翌年度事業の委託先は前年度の1〜3月に公告・決定される。
#   「今年度の新着」だけを見ていると、翌年度案件を丸ごと取り逃す。
#   御社の受注実績（令和7年度 MAISON&OBJET、4,098万円）もこの型。
tier_kosha:
  meta:
    issuer: 公益財団法人東京都中小企業振興公社
    archive: https://www.tokyo-kosha.or.jp/kosha/keiyaku/end/index.html
    portal: https://www.chancenavi.jp/bcn/  # ビジネスチャンス・ナビ。希望申出はここで受付
    note: |
      **希望申出は「ビジネスチャンス・ナビ」上で受け付ける。** 事前の事業者登録が必須。
      公告から締切まで7〜10日と極めて短いため、登録を済ませていないと物理的に間に合わない。
      **これが最優先の事前準備。**
    cycle: |
      1月下旬〜3月下旬に翌年度案件が集中公告される。年度途中（6〜9月）にも
      個別の展示会出展ブース装飾等が単発で出る。

  # 御社の主力と直結する案件（令和8年度の実績日付。翌年も同時期と想定）
