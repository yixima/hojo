# ─────────────────────────────────────────────────────────────
# 国際園芸博覧会 GREEN×EXPO 2027 ― 今まさに各県が動いている
# ─────────────────────────────────────────────────────────────
tier_expo2027:
  meta:
    event: 2027年国際園芸博覧会（GREEN×EXPO 2027）
    venue: 横浜市 旧上瀬谷通信施設
    period: 2027年3月19日 〜 9月26日
    note: |
      **現在進行中の最大の鉱脈。** 開幕が2027年3月のため、各都道府県・政令市が
      2026年度中に出展業務委託を順次公告する。既に福島・福岡・宮崎で確認済み。
      **未公告の県は今後半年で出す可能性が高い。** 毎回の巡回で全県をチェックすること。
  observed:
    - { pref: 福島県, announced: 2026-08頃, deadline: 2026-09-04, status: 公募中 }
    - { pref: 福岡県, announced: 2026-05-25, deadline: 2026-06-19, status: 締切済 }
    - { pref: 宮崎県, announced: 2026-06-10, deadline: 2026-07頃, status: 結果公表済 }
  watch:
    targets: 47都道府県 ＋ 政令指定都市20市
    keywords: [国際園芸博覧会, GREEN×EXPO, 園芸博, 花博, 出展業務, 出展作品]
    watch_from: 継続（毎回の巡回で確認）
    confidence: high
    note: |
      出展形態は「屋内出展作品の設計・施工・維持管理」「屋外出展業務」「出展業務委託」
      など県により異なる。いずれも御社のブース設計施工・展示演出・現地運営の実績が
      そのまま実績要件になる。

