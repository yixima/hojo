qualifications:
  # 2026-08-31、生島様より現況を伺い、全面的に更新した。
  # それまで「統一資格は申請中・未取得」「東京都は未登載」と記録していたが、
  # **どちらも誤りだった。両方とも取得済みである。**
  # この誤りにより、東京都の案件を「名簿未登載のため応募不可」と繰り返し報告した。
  # 正しい判定軸は「登載の有無」ではなく **「等級が受付等級に届くか」** である。

  zenshocho_toitsu:                # 全省庁統一資格
    held: true                     # status: confirmed（生島様 2026-08-31）
    grade: D                       # **D等級**
    note: |
      **当面Dのまま**との方針（2026-08-31）。
      Dで届かない案件は、**コンソーシアム（共同企業体）または当社が再委託先**
      となる形であれば参加できる。単独応募だけで可否を判定しない。

  tokyo_metropolitan:              # 東京都 物品買入れ等 競争入札参加資格
    held: true                     # status: confirmed
    source: docs/shikaku/tokyo_shikaku_R7-8_20260226.pdf   # 競争入札参加資格審査結果通知書
    受付番号: "22104577"
    申請局: 財務局・交通局・水道局・下水道局
    適用年月日: 2025-05-01           # 令和7年5月1日 ＝ **随時受付で取得した**（定期受付なら4/1）
    有効期限: 2027-03-31             # 令和9年3月31日
    中小企業分類: "（物品）中小企業／（委託）－－"
    等級: C                          # 4種目すべてC等級
    登録営業種目:                     # **一次資料で確定（2026-08-31）**
      - {コード: 115, 名称: 広告代理,        品目: "07, 98",         等級順位: C-0002-50}
      - {コード: 116, 名称: 映像等製作,      品目: "01, 03",         等級順位: C-0050-66}
      - {コード: 120, 名称: 催事関係業務,    品目: "01, 03, 04, 98", 等級順位: C-0000-33}
      - {コード: 190, 名称: その他の業務委託等, 品目: "08",           等級順位: C-0198-50}
    note: |
      **120 催事関係業務が登録されている。品目は 01（催事の企画から会場設営まで）・
      03（舞台照明装置等の演出・保守点検）・04（会場運営・展示業務）・98（その他全般）。**
      したがって東京都の催事案件のうち、**受付等級にCを含むものには応募できる。**

      **受付等級に「C」が含まれない案件（A / A,B / B）には応募できない。**
      2026-08-31 の実測では、希望申請受付中28件のうちC等級で入れるのは13件。

    定期受付で見直すべき点:            # 2026-09-14〜10-30 が唯一の機会
      - "**品目 05（都市装飾）が未登録。**120の品目は8つまで取れるが4つしか取っていない"
      - "**4種目しか取っていない。10種目まで取れる。**未登録で当社に効くのは
         101 印刷／134 企画立案支援／114 運送等請負／105 警備・受付"
      - "**等級C が最大の制約。**A・B限定の案件（ねんりんピック第1号は等級A）に届かない"
      - "ただし売上高のない種目を足すと、その種目はX格（無格付）になる。数を増やせばよいものではない"

  invoice_registered: null         # status: unconfirmed

